<style>
/* Layout: one phone column; glowing session-tinted header, floating cards, frosted bottom tab bar.
   Single dark look on purpose: night-gym graphite, each session has its own color (--sc), set from script. */
:root{
  --bg:#0a0d14; --surface:#131926; --raise:#1a2233; --sunk:#0e131d; --ink:#f1f4fa; --muted:#a2adc2; --line:#252f43;
  --sc:#5b8cff; --on-sc:#0a0d14;
  --ua:#5b8cff; --la:#ffb547; --ub:#2dd4bf; --lb:#ff6fae; --arms:#b69cff;
  --good:#3ee08f; --warn:#ffb547; --danger:#ff7a7a; --kcal:#ffb547; --kcal2:#ff6fae; --prot:#2dd4bf; --prot2:#3ee08f;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font:18px/1.5 var(--body);-webkit-text-size-adjust:100%;background:
  radial-gradient(900px 420px at 50% -120px, color-mix(in srgb,var(--sc) 26%, transparent), transparent 70%), var(--bg);background-attachment:fixed}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 230px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:14px 12px;margin-inline:-16px;padding-inline:16px;
  background:color-mix(in srgb,var(--bg) 78%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--sc) 30%, var(--line))}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand h1{font:700 28px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:10px;white-space:nowrap;min-width:0}
.brand h1::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--sc);box-shadow:0 0 14px var(--sc)}
.sync{font-size:14px;color:var(--muted)}
.datebar{display:flex;align-items:center;gap:10px;margin-top:12px}
.datebar .d{flex:1;text-align:center;font:700 22px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.datebar .d small{display:block;font:500 15px var(--body);letter-spacing:0;text-transform:none;color:var(--sc);margin-top:3px}
.icon{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;cursor:pointer;font-size:28px;color:var(--ink)}
main{display:flex;flex-direction:column;gap:14px;padding-top:16px}
h2{font:700 28px/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0}
.label{font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.card{background:linear-gradient(180deg,var(--raise),var(--surface) 70%);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 10px 30px -18px rgba(0,0,0,.8)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--sc);border:1.5px solid color-mix(in srgb,var(--c) 45%, var(--line));background:color-mix(in srgb,var(--c) 10%, var(--surface));color:var(--ink);border-radius:999px;padding:11px 16px;font-size:17px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);color:var(--on-sc);border-color:var(--c);font-weight:600;box-shadow:0 0 18px -4px var(--c)}
.btn{border:0;background:var(--sc);color:var(--on-sc);border-radius:14px;padding:14px 18px;font-weight:600;font-size:18px;cursor:pointer;white-space:nowrap;min-height:54px;box-shadow:0 8px 22px -10px var(--sc)}
.btn.ghost{background:color-mix(in srgb,var(--ink) 9%, transparent);color:var(--ink);box-shadow:none}
.btn.small{padding:10px 14px;font-size:16px;min-height:44px}
.btn.finish{background:linear-gradient(90deg,var(--good),var(--prot));color:var(--on-sc);box-shadow:0 8px 24px -10px var(--good)}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px 10px;font-size:20px;min-width:44px;min-height:44px}
.link:hover{color:var(--danger)}
:focus-visible{outline:2px solid var(--sc);outline-offset:2px}
input.f,select.f{width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:14px 12px;font-size:20px;color:var(--ink)}
input.f:focus{border-color:var(--sc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 25%, transparent)}
input.f::placeholder{color:color-mix(in srgb,var(--muted) 70%, transparent)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meta label{display:flex;flex-direction:column;gap:4px;min-width:0}
.ex-head{display:flex;align-items:flex-start;gap:8px}
.ex-head h3{margin:0;font:700 26px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;flex:1;min-width:0}
.plan{font:600 16px var(--mono);color:var(--sc);white-space:nowrap;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--sc) 14%, transparent)}
.note{font-size:16px;color:var(--muted)}
.last{font-size:16px;color:var(--muted)}
.last b{font:500 16px var(--mono);color:var(--ink)}
.badge{display:inline-block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--good) 18%, transparent);color:var(--good)}
.badge.hold{background:color-mix(in srgb,var(--sc) 18%, transparent);color:var(--sc)}
.badge.down{background:color-mix(in srgb,var(--warn) 18%, transparent);color:var(--warn)}
.sets{display:flex;flex-wrap:wrap;gap:8px}
.set{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--sc) 12%, var(--sunk));border:1px solid color-mix(in srgb,var(--sc) 35%, var(--line));border-radius:12px;padding:8px 4px 8px 12px;font:600 18px var(--mono);font-variant-numeric:tabular-nums}
.set i{font-style:normal;color:var(--sc);font-size:14px}
.set button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 8px;font-size:22px;min-height:36px}
.add{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.add span{color:var(--muted);font-size:22px}
.add .btn{grid-column:1/-1}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.stat .v{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--sc)}
.stats .stat:nth-child(2) .v{color:var(--prot)}
.stats .stat:nth-child(3) .v{color:var(--kcal)}
.stat .k{font-size:15px;color:var(--muted);margin-top:4px}
.bar{height:16px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--kcal),var(--kcal2));border-radius:99px}
.bar.p>div{background:linear-gradient(90deg,var(--prot),var(--prot2))}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px}
.food{display:flex;flex-direction:column}
.food .it{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.food .it:last-child{border-bottom:0}
.food .it span:first-child{min-width:0;overflow-wrap:anywhere}
.fadd{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fadd .btn{grid-column:1/-1}
.fadd input:first-child{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:10px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
svg text{fill:var(--muted);font:13px var(--mono)}
.prog h3{margin:0;font:700 24px var(--display);text-transform:uppercase;letter-spacing:.03em}
.prog ul{margin:0;padding-left:18px}
.prog li{margin:3px 0}
.prog li span{font:500 16px var(--mono);color:var(--muted)}
.prog .focus b{color:var(--sc)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.week div{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px 2px;font-size:13px;min-width:0;color:var(--muted)}
.week div b{display:block;font:700 18px var(--display);text-transform:uppercase;color:var(--ink)}
.week div.on{border-color:color-mix(in srgb,var(--sc) 50%, var(--line))}

function weekPlan(today){
  today=today||todayKey();
  const mon=(()=>{const t=new Date(today+"T12:00:00");return addDays(today,-((t.getDay()+6)%7));})(),wk=[...Array(7)].map((_,i)=>addDays(mon,i));
  const logged={};wk.forEach(k=>{if(k<=today&&trained(k))logged[k]=S.days[k].session||"Workout";});
  const done=new Set(Object.values(logged).filter(x=>ORDER.includes(x)));
  const last=lastOrderSession(today),start=last?(ORDER.indexOf(last)+1)%ORDER.length:0;
  const remaining=ORDER.map((_,i)=>ORDER[(start+i)%ORDER.length]).filter(x=>!done.has(x));
  const first=trained(today)?addDays(today,1):today;
  const free=wk.filter(k=>k>=first&&!logged[k]);
  const at={...logged},plan=[],unplaced=[];
  const lowerNear=k=>[addDays(k,-1),addDays(k,1)].some(x=>isLower(at[x]));
  const defDay=x=>{const d=+Object.keys(WEEK).find(w=>WEEK[w]===x);return addDays(mon,(d+6)%7);};
  remaining.forEach(x=>{
    const ok=k=>!at[k]&&!(isLower(x)&&lowerNear(k));
    const k=free.find(k=>ok(k)&&new Date(k+"T12:00:00").getDay()%6!==0)||free.find(ok);
    if(!k){unplaced.push(x);return;}
    at[k]=x;
    const dd=defDay(x);let why="";
    if(k!==dd){
      if(dd<first&&!done.has(x))why=`Not done ${DOW[new Date(dd+"T12:00:00").getDay()]}, so it moves here`;
      else if(isLower(x)&&[addDays(dd,-1),addDays(dd,1)].some(y=>isLower(at[y])&&y!==k))why="Moved so there's a rest day between sessions";

}

/* ---------- progression (double progression + reps in reserve) ---------- */
function target(e,beforeKey){
  const P=parsePlan(e.plan); if(!P) return null;
  const prev=lastFor(e.name,beforeKey), rng=P.lo===P.hi?`${P.lo}`:`${P.lo}–${P.hi}`;
  if(!prev) return {kind:"new",w:"",text:`${P.n} sets × ${rng}`,why:`First time: pick a weight that leaves about 2 reps in the tank at ${P.hi}.`};
  return suggest(e.name,prev.e.sets,P,rng);
}
function suggest(name,sets,P,rng){
  rng=rng||(P.lo===P.hi?`${P.lo}`:`${P.lo}–${P.hi}`);
  if(sets.length&&sets.every(s=>!n(s.w))){const reps=sets.map(s=>n(s.r)),top=sets.length>=2?reps.every(r=>r>=P.hi):reps[0]>=P.hi+2;
    if(top)return {kind:"up",w:"",text:`${P.n} sets × ${rng} reps`,why:`You hit ${reps.join(", ")}. Make it harder: 3 s lowering, a pause, or add a little weight.`};
    const goal=Math.min(P.hi,Math.max(...reps)+1);return {kind:"hold",w:"",text:`${P.n} sets × ${rng} reps`,why:`Beat last time: aim for ${goal} reps on every set.`};}
  const mx=Math.max(...sets.map(s=>n(s.w)));
  const work=sets.filter(s=>n(s.w)===mx), reps=work.map(s=>n(s.r)), tot=reps.reduce((a,b)=>a+b,0), ar=avgRir(work);
  const hitTop = work.length>=2 ? tot>=P.hi*work.length-1 : reps[0]>=P.hi+2;
  if(hitTop){const step=inc(name,mx)*(ar!=null&&ar>=3?2:1);const nw=r05(mx+step);
    return {kind:"up",w:nw,text:`${nw} × ${rng}, ${P.n} sets`,why:ar!=null&&ar>=3?`Top of the range with ${rirTxt(Math.round(ar))} reps left: too light. Jump to ${nw}.`:`You hit ${reps.join(", ")} at ${mx}. Go up to ${nw} and start at ${P.lo}+ reps.`};}
  if(tot/work.length < P.lo-1){const nw=r05(mx*0.9);return {kind:"down",w:nw,text:`${nw} × ${rng}, ${P.n} sets`,why:`${reps.join(", ")} at ${mx} is under the ${rng} range. Drop to ${nw} and own the reps.`};}
  const goal=Math.min(P.hi,Math.max(...reps)+(ar!=null&&ar>=3?2:1));
  return {kind:"hold",w:mx,text:`${mx} × ${rng}, ${P.n} sets`,why:ar!=null&&ar>=3?`You had 3+ reps left. Stay at ${mx} and add reps: aim for ${goal} on every set.`:`Stay at ${mx}. Beat last time: aim for ${goal} on every set.`};
}

/* ---------- conservative calorie burn ---------- */
function burn(k){
  const d=S.days[k];if(!d||S.settings.burnOn===false)return null;
  const pct=(n(S.settings.burnPct)||100)/100, bw=n(d.bw)||n(weightTrend().avg7)||n(S.settings.startBw)||150, f=bw/182;
  const ts=(d.exercises||[]).flatMap(e=>(e.sets||[]).map(s=>n(s.t))).filter(Boolean).sort((a,b)=>a-b);
  let liftMin=ts.length>=2?(ts[ts.length-1]-ts[0])/60000+1.5:null;
  if(liftMin===null&&duration(d)!=null&&(d.exercises||[]).some(e=>e.sets?.length))liftMin=duration(d)*0.8;
  const r10=x=>Math.round(x/10)*10, rng=(min,a,b)=>min>0?[r10(min*a*f*pct),r10(min*b*f*pct)]:null;
  const drum=n(d.drum), out={liftMin:liftMin?Math.round(liftMin):null,lift:rng(liftMin||0,3,4),walk:rng(n(d.cardio),4,5),drum:rng(drum*(drum>=120?0.6:1),3,4)};
  const parts=[out.lift,out.walk,out.drum].filter(Boolean);
  out.total=parts.length?[parts.reduce((a,p)=>a+p[0],0),parts.reduce((a,p)=>a+p[1],0)]:null;
  return out;
}

/* ---------- recap: this session vs the last same session ---------- */
function prevSession(k){const d=S.days[k];if(!d?.session)return null;

  const done=(d.exercises||[]).filter(e=>e.sets?.length);

    const pe=pd?(pd.exercises||[]).find(x=>x.sets?.length&&(x.name===e.name||(e.swapOf&&x.name===e.swapOf)||(x.swapOf&&x.swapOf===e.name))):null;
    let label="Baseline",cls="hold";

      if(n(tp.w)>n(pt.w)||(n(tp.w)===n(pt.w)&&n(tp.r)>n(pt.r))||(v>pv*1.02&&n(tp.w)>=n(pt.w))){label="Progressed";cls="up";}
      else if(n(tp.w)<n(pt.w)||v<pv*0.95){label="Regressed";cls="down";}
      else label="Held";
      if(n(tp.w)>n(pt.w))out.good.push(`${e.name}: weight up to ${tp.w}`);
      else if(n(tp.w)===n(pt.w)&&n(tp.r)>n(pt.r))out.good.push(`${e.name}: +${n(tp.r)-n(pt.r)} reps at ${tp.w}`);
      if(cls==="down")out.bad.push(`${e.name}: less than last time (${setTxt(pt)} → ${setTxt(tp)})`);}
    const allBest=sortedKeys().filter(x=>x<k).flatMap(x=>(S.days[x].exercises||[]).filter(y=>y.name===e.name).flatMap(y=>y.sets||[]));
    if(allBest.length&&e1rm(n(tp.w),n(tp.r))>Math.max(...allBest.map(s=>e1rm(n(s.w),n(s.r))))+0.5)out.good.push(`${e.name}: new best (est. 1RM ${Math.round(e1rm(n(tp.w),n(tp.r)))})`);
    if(P){if(sets.length>=P.n&&sets.every(s=>n(s.r)>=P.lo&&n(s.r)<=P.hi))out.good.push(`${e.name}: all sets in the ${P.lo}–${P.hi} range`);
      const low=sets.filter(s=>n(s.r)<P.lo).length;if(low)out.bad.push(`${e.name}: ${low} set${low>1?"s":""} under ${P.lo} reps`);
      if(sets.length<P.n)out.bad.push(`${e.name}: ${sets.length} of ${P.n} sets`);}
    if(ar!=null&&ar>=3)out.bad.push(`${e.name}: ${rirTxt(Math.round(ar))} reps left on average, too light`);
    if(sets.length>=2&&sets.every(s=>s.rir===0)&&HEAVY.test(e.name))out.bad.push(`${e.name}: every set to failure, too heavy for a big lift`);
    out.rows.push({name:e.name,label,cls,sets:sets.length,top:tp,vol:Math.round(v),ar,prev:pe?topSet(pe.sets):null});
    if(P){const s=suggest(e.name,sets,P);out.next.push({name:e.name,text:s.text,kind:s.kind});}
  });

  (d.exercises||[]).forEach(e=>{if(!e.sets?.length&&e.name!=="Incline walk")out.bad.push(`${e.name}: skipped`);});
  out.sets=done.reduce((a,e)=>a+e.sets.length,0);out.vol=Math.round(done.reduce((a,e)=>a+vol(e.sets),0));

function findMine(qs){const qq=qs.trim().toLowerCase();if(!qq)return null;const arr=Object.entries(S.foods);

async function lookup(){
  const L=S.look;const q=(L.q||"").trim();if(!q){toast("Type a food first.");return;}
  const mine=findMine(q);
  if(mine&&!L.forceOnline){useMine(mine[0]);render();return;}
  L.forceOnline=false;
  if(!S.sampleText)return;
  L.ctl=new AbortController();L.status="working";L.msg="";L.food=null;L.src="";L.edit=false;render();
  const prompt=`Give the nutrition facts for one food, like a nutrition label, for a calorie-tracking app.
Food: "${q.replace(/"/g,"'")}"
Use the brand's published label when a brand or restaurant is named, otherwise standard USDA values. List 2 to 4 serving sizes: first the most common serving (the label serving for brands), then other useful ones such as 1 cup, 1 oz, 1 piece, and always "100 g" when weighing makes sense. Each serving gives values for exactly that serving. If the text names several foods, use only the first and say so in "note".
Reply with only JSON in this shape:
{"name":"Egg, whole, large","servings":[{"label":"1 large egg (50 g)","kcal":72,"protein":6.3,"carbs":0.4,"fat":4.8},{"label":"100 g","kcal":143,"protein":12.6,"carbs":0.7,"fat":9.5}],"note":""}`;
  try{
    const r=await S.sampleText.json(prompt,{signal:L.ctl.signal});
    const sv=Array.isArray(r?.servings)?r.servings.filter(x=>x&&x.label).map(x=>({label:String(x.label),kcal:n(x.kcal),protein:n(x.protein),carbs:x.carbs==null?null:n(x.carbs),fat:x.fat==null?null:n(x.fat)})):[];
    if(!sv.length) L.msg="Couldn't find that food. Try a different name.";

  }catch(e){

      if(["not_granted","sampling_disabled","capability_disabled","capability_removed","not_declared"].includes(e?.code)) S.sampleText=null;}

}

const SAMPLE_MSG={not_granted:"Photo estimates need your OK to use Claude. Reload the page to be asked again.",sampling_disabled:"Claude isn't available on this account, so photo estimates are off.",rate_limited:"Too many requests right now. Wait a minute and try again.",session_expired:"Sign in to Claude again, then try.",image_rejected:"That image couldn't be read. Try a JPEG or PNG under 20 MB.",refused:"Claude couldn't estimate this photo. Try a clearer shot of the plate.",invalid_json:"The estimate came back garbled. Tap Re-estimate.",images_unavailable:"This app view can't send photos. Open it in the Claude app or a browser."};
async function estimate(){

function spark(points,unit){
  if(points.length<2) return "";
  const W=320,H=120,P={l:50,r:10,t:10,b:22};
  const ys=points.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),pad=(mx-mn)*0.15||1,lo=mn-pad,hi=mx+pad;
  const X=i=>P.l+i*(W-P.l-P.r)/(points.length-1), Y=v=>P.t+(hi-v)*(H-P.t-P.b)/(hi-lo);
  const d=points.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const last=points[points.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Trend chart">
    <line x1="${P.l}" x2="${W-P.r}" y1="${Y(mx)}" y2="${Y(mx)}" stroke="var(--line)"/><line x1="${P.l}" x2="${W-P.r}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="var(--line)"/>
    <text x="${P.l-6}" y="${Y(mx)+4}" text-anchor="end">${r1(mx)}</text><text x="${P.l-6}" y="${Y(mn)+4}" text-anchor="end">${r1(mn)}</text>
    <path d="${d}" fill="none" stroke="var(--sc)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${X(points.length-1)}" cy="${Y(last.y)}" r="4" fill="var(--sc)"/>
    <text x="${P.l}" y="${H-4}">${short(points[0].k)}</text><text x="${W-P.r}" y="${H-4}" text-anchor="end">${short(last.k)}</text>
  </svg>`;
}

/* ---------- weight trend → calorie guidance ---------- */
function goal(){const T=S.settings;return {lo:-0.25,hi:0.5,since:T.targetSince||"",floor:1400};}
function weightTrend(){
  const t=todayKey(),from=addDays(t,-20);
  const pts=sortedKeys().filter(k=>k>=from&&k<=t&&n(S.days[k].bw)>0).map(k=>({k,y:n(S.days[k].bw),x:(new Date(k+"T12:00:00")-new Date(from+"T12:00:00"))/864e5}));
  const avg=a=>a.reduce((s,p)=>s+p.y,0)/a.length;
  const last7=pts.filter(p=>p.k>addDays(t,-7));
  const out={pts,avg7:last7.length?r1(avg(last7)):null,rate:null,span:0};
  if(pts.length>=2){out.span=pts[pts.length-1].x-pts[0].x;
    const mx=pts.reduce((s,p)=>s+p.x,0)/pts.length,my=avg(pts);
    const num=pts.reduce((s,p)=>s+(p.x-mx)*(p.y-my),0),den=pts.reduce((s,p)=>s+(p.x-mx)**2,0);
    if(den>0)out.rate=r1(num/den*7);}
  return out;
}
function weightGuide(){
  const G=goal(),T=S.settings,w=weightTrend(),k=n(T.kcal);
  const ready=w.pts.length>=6&&w.span>=10;
  if(!ready){const first=addDays(G.since||todayKey(),14);
    return {state:"wait",title:"Building your trend",text:`${w.pts.length} weigh-in${w.pts.length===1?"":"s"} in the last 3 weeks. Weigh in a few mornings a week, after the bathroom and before eating. First trend check ${first>todayKey()?"around "+fmt(first,{weekday:"short",month:"short",day:"numeric"}):"after a few more weigh-ins"}.`};}
  const r=w.rate;let s,title,text,to=null;
  if(r<-0.75){s="fast";title="Losing weight";text=`You're down ${r1(-r)} lb a week. To build muscle, eat a bit more: add a snack or a bigger portion at a meal.`;}
  else if(r<-0.25){s="slow";title="Slowly losing";text=`Down ${r1(-r)} lb a week. Fine if you want to lean out a little; for faster glute growth, eat a bit more.`;}
  else if(r<=0.5){s="ok";title="On track";text=`Weight is steady (${r>0?"+":""}${r} lb a week): right for building muscle. Keep hitting your protein.`;}
  else{s="slow";title="Gaining a bit fast";text=`Up ${r1(r)} lb a week. Some is muscle, but ease off snacks a little.`;}
  if(to===k)to=null;
  return {state:s,title,text,to,rate:w.rate};
}
/* ---------- expected loss from logged calories vs the scale ---------- */
function maint(){return n(S.settings.maint)||n(S.settings.kcal)||1800;}
function loggedVsReal(){
  const t=todayKey(),from=addDays(t,-21),M=maint();
  const days=sortedKeys().filter(k=>k>=from&&k<t&&S.days[k].food?.length);   // full past days only; today is still open
  const intake=days.map(k=>S.days[k].food.reduce((a,f)=>a+n(f.kcal),0));
  const avgIn=days.length?Math.round(intake.reduce((a,b)=>a+b,0)/days.length):null;
  const totDef=intake.reduce((a,x)=>a+(M-x),0);
  const out={days:days.length,first:days[0]||null,avgIn,M,expTotal:r1(totDef/3500),expRate:avgIn!==null?r1((M-avgIn)*7/3500):null,realRate:null,realTotal:null,realM:null};
  const w=weightTrend();
  if(w.rate!==null&&w.pts.length>=4&&w.span>=6){out.realRate=r1(w.rate);
    const span=days.length?Math.max(1,(new Date(t+"T12:00:00")-new Date(days[0]+"T12:00:00"))/864e5):0;
    out.realTotal=r1(w.rate*span/7);
    if(days.length>=7&&w.span>=10)out.realM=Math.round((avgIn+(-w.rate)*3500/7)/10)*10;}
  return out;
}
function vLogged(){
  const L=loggedVsReal(),f=v=>v===null?"—":(v>0?"−":v<0?"+":"")+Math.abs(v);

      <div class="stat"><div class="v" style="color:var(--kcal)">${f(L.expRate)}</div><div class="k">lb/week expected from what you logged</div></div>

  return h;
}

function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/);let h="",inUl=false,para=[];
  const flush=()=>{if(para.length){h+=`<p>${para.join("<br>")}</p>`;para=[];}};
  for(const L of lines){const m=L.match(/^\s*[-•*]\s+(.*)/);
    if(m){flush();if(!inUl){h+="<ul>";inUl=true;}h+=`<li>${m[1]}</li>`;continue;}
    if(inUl){h+="</ul>";inUl=false;}
    if(!L.trim()){flush();continue;}
    para.push(L.replace(/^#+\s*/,""));}
  flush();if(inUl)h+="</ul>";return h;
}

    else{(m.did||[]).forEach((d,di)=>{h+=`<div class="did">✓ ${esc(d.label)}${d.undo&&!d.undone?`<button data-act="chatundo" data-m="${mi}" data-d="${di}">Undo</button>`:""}</div>`;});
      h+=`<div class="msg ai${m.err?" err":""}">${md(m.text)}</div>`;}
  });
  if(C.busy)h+=`<div class="msg ai" id="livemsg">${C.live?md(C.live):`<span class="thinking">Thinking…</span>`}</div>`;
  h+=`<div id="chatend"></div></div>
    <div class="compose">
      ${C.imgUrl?`<div class="attached"><img src="${C.imgUrl}" alt="Photo to send"><span>Photo attached</span><button class="link" data-act="chatimgx" aria-label="Remove photo">✕</button></div>`:""}
      <textarea class="f" id="chatin" placeholder="${S.canPhoto?"Ask your coach, or attach a photo…":"Ask your coach…"}" aria-label="Message">${esc(C.draft)}</textarea>
      <div class="row2">${S.canPhoto&&!C.busy?`<label class="btn ghost" for="chatimg" style="flex:0 0 auto">📷</label><input type="file" id="chatimg" accept="image/*" class="hidefile">`:""}${C.busy?`<button class="btn ghost" data-act="chatstop">Stop</button>`:`<button class="btn" data-act="chatsend">Send</button>`}</div>
    </div></section>`;
  if(pend.length||done.length){
    h+=`<section class="card"><span class="label">App changes you asked for</span>
      ${pend.map(r=>`<div class="req"><b>${esc(r.title)}</b><span class="note">${esc(r.details||"")}</span><span><span class="badge wait">Waiting to be built</span></span></div>`).join("")}
      ${done.map(r=>`<div class="req"><b>${esc(r.title)}</b><span><span class="badge">Built</span></span></div>`).join("")}
      ${pend.length?`<div class="note">To build these, tell Claude: “build my gym app requests.”</div>`:""}
    </section>`;
  }
  return h;
}

function render(){
  if(isTyping()){S.needRender=true;return;}
  S.needRender=false;
  const ds=S.days[S.date]?.session; let sc=SC[ds];
  if(!sc&&S.date===todayKey()&&S.mode!=="loading"){try{sc=SC[nextWorkout().sess];}catch(e){}}
  document.documentElement.style.setProperty("--sc",sc||"#5b8cff");
  const isToday=S.date===todayKey();
  document.getElementById("dateLabel").innerHTML=`${fmt(S.date)}<small>${isToday?"Today":(S.date<todayKey()?"Past day":"Upcoming")}</small>`;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab));
  document.querySelector(".datebar").hidden=(S.tab==="program"||S.tab==="progress"||S.tab==="coach"||S.tab==="next");

}

/* ---------- workout handlers ---------- */
function pickSession(k,s){
  const d=ensure(k);d.session=s;S.entry={};S.ui={form:{},swap:{},tip:{},more:{}};
  if(PROGRAM[s]&&!d.exercises.some(x=>x.sets?.length)){loadSession(d,s);}
  if(s==="Rest"&&!d.exercises.some(x=>x.sets?.length)) d.exercises=[];
  save(k);render();
}
document.addEventListener("change",ev=>{const el=ev.target;if(!el.dataset?.sess)return;pickSession(S.date,el.value);});
function addSet(i){
  const k=S.date,d=ensure(k),e=d.exercises[i];if(!e)return;
  const bw=isBW(e),wEl=document.getElementById("w-"+i);
  const r=String(document.getElementById("r-"+i)?.value||"").trim();let w=String(wEl?.value||"").trim();
  if(bw&&w==="")w="0";
  if(!r||!w||!isFinite(+r)||!isFinite(+w)){toast(bw?"Enter reps as a number.":"Enter reps and weight as numbers.");return;}
  const ent=S.entry[i]||{rir:null,tags:[]},s={r:+r,w:+w,t:Date.now()};
  if(bw)s.bw=true;
  if(ent.rir!=null)s.rir=ent.rir;
  e.sets=e.sets||[];e.sets.push(s);delete ent.r;delete ent.w;ent.rir=null;
  if(!d.session)d.session="Custom";
  if(k===todayKey()&&!d.start)d.start=s.t;
  try{S.ac=S.ac||new (window.AudioContext||window.webkitAudioContext)();S.ac.resume&&S.ac.resume();}catch(x){}
  if(k===todayKey())startRest(restFor(e)+((s.rir!=null&&s.rir<=1&&HEAVY.test(e.name))?30:0),e.name);
  save(k);document.activeElement?.blur();render();
}

    case "formsave":{const nm=b.dataset.n,g=id=>document.getElementById(id)?.value??"",lines=x=>x.split("\n").map(s=>s.trim()).filter(Boolean);
      const o={cue:g("fe-cue").trim(),grip:g("fe-grip").trim(),path:g("fe-path").trim(),growth:lines(g("fe-growth")),safe:lines(g("fe-safe")),tip:g("fe-tip").trim(),video:g("fe-video").trim()};
      const rs=g("fe-rest").trim();if(rs!=="")o.rest=Math.max(0,Math.round(n(rs)));
      S.exo=S.exo||{};S.exo[slugEx(nm)]={name:nm,...o};S.editEx=null;render();
      saveLocal();toast("Tips saved");break;}
    case "pickex":{const e=E();if(e.sets?.length)return;e.name=b.dataset.n;delete e.swapOf;save(k);render();break;}

    case "swapperm":{const e=E(),base=e.swapOf||e.name;S.settings.swaps={...(S.settings.swaps||{}),[base]:b.dataset.n};saveSettings();

    case "unswap":{const e=E();if(e.sets?.length)return;e.name=e.swapOf;delete e.swapOf;save(k);render();break;}

      save(k);render();break;}
    case "exreopen":{const e=E();e.done=false;delete e.doneAt;save(k);render();break;}
    case "reord":S.reorder=!S.reorder;render();break;
    case "exup":case "exdown":{const ex=D().exercises,act=[...ex.keys()].filter(x=>!ex[x].done),p=act.indexOf(i),q=a==="exup"?p-1:p+1;
      if(q<0||q>=act.length)return;const j=act[q];[ex[i],ex[j]]=[ex[j],ex[i]];S.entry={};S.ui={form:{},swap:{},tip:{},more:{}};save(k);render();break;}
    case "rest":{if(!S.rest)return;if(b.dataset.d==="skip")S.rest=null;else{S.rest.end+=n(b.dataset.d)*1000;S.rest.beeped=false;}saveRest();tick();break;}
    case "sstart":{const d=D();d.start=Date.now();delete d.end;delete d.dur;save(k);render();tick();break;}
    case "sstop":{const d=ensure(todayKey());if(d.start&&!d.end){d.end=Date.now();save(todayKey());render();tick();toast("Workout time saved: "+duration(d)+" min");}break;}
  }
});

async function prepImage(file){
  // re-encode to JPEG (handles HEIC where the browser can decode it) and cap at 1600 px
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=url;});
    const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.85));
  }finally{URL.revokeObjectURL(url);}
}
const ASSET_MSG={quota:"Phone storage is full.",too_large:"That photo is too big. Try a smaller one.",unsupported_type:"That file type can't be saved. Use a JPEG or PNG.",quota_or_state:"Photo storage is full. Delete a few old photos first.",rate_limited:"Too many uploads at once. Wait a minute and try again.",upstream_auth:"Sign in to Claude again, then try.",not_granted:"Photo saving isn't allowed in this view.",capability_disabled:"Photo saving isn't available in this view."};

    catch(e){if(e?.code==="store_unavailable"){await new Promise(z=>setTimeout(z,1500));r=await S.assets.upload(blob,{type:"image/jpeg"});}else throw e;}
    const t=todayKey(),w=S.days[t]?.bw||weightTrend().avg7||null,id="p"+Date.now().toString(36);
    const doc={asset:r.id,date:t,pose,created:new Date().toISOString(),...(w?{bw:n(w)}:{}),...(note?{note:String(note).slice(0,200)}:{})};

const DEFAULT = {program:JSON.parse(JSON.stringify(PROGRAM)),week:{...WEEK}};
const PALETTE=["#ff6fae","#b69cff","#2dd4bf","#ffb547","#5b8cff","#3ee08f"];
const DAYNUM={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
function defaultWeek(names){const pat={1:[1],2:[1,4],3:[1,3,5],4:[1,2,4,5],5:[1,2,3,5,6],6:[1,2,3,4,5,6]}[Math.min(6,names.length)]||[1];const w={};names.forEach((x,i)=>{if(pat[i]!=null)w[pat[i]]=x;});return w;}
function parseProgram(text){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const prog={},errs=[];let days=null,focus={};
  for(const raw of lines){
    const l=raw.replace(/^[-*•]\s*/,"");
    if(/^program\b:?$/i.test(l)||/^```/.test(l))continue;
    let m=l.match(/^days?\s*:\s*(.+)$/i);
    if(m){days={};m[1].split(/[,;]/).forEach(part=>{const mm=part.trim().match(/^([a-z]{3})[a-z]*\s*[=:-]\s*(.+)$/i);if(mm&&DAYNUM[mm[1].toLowerCase()]!=null)days[DAYNUM[mm[1].toLowerCase()]]=mm[2].trim();});continue;}
    m=l.match(/^focus\s*\(([^)]+)\)\s*:\s*(.+)$/i);if(m){focus[m[1].trim()]=m[2].trim();continue;}
    m=l.match(/^([^:]{1,40}):\s*(.+)$/);
    if(!m){errs.push(`Can't read: "${raw.slice(0,60)}"`);continue;}
    const name=m[1].trim(),ex=[];
    m[2].split(";").map(x=>x.trim()).filter(Boolean).forEach(item=>{
      const note=(item.match(/\(([^)]*)\)\s*$/)||[])[1]||"";const body=item.replace(/\([^)]*\)\s*$/,"").trim();
      let mm=body.match(/^(.+?)\s+(\d+)\s*[x×]\s*(\d+)(?:\s*[-–]\s*(\d+))?\s*(s|sec|secs|seconds)?$/i);
      if(mm){const pl=`${mm[2]}×${mm[3]}${mm[4]?"–"+mm[4]:""}`;ex.push([mm[1].trim(),pl,(mm[5]?"seconds":"")+(mm[5]&&note?", ":"")+note]);return;}
      mm=body.match(/^(.+?)\s+(\d+)\s*(min|mins|minutes)$/i);
      if(mm){ex.push([mm[1].trim(),`${mm[2]} min`,note]);return;}
      errs.push(`${name}: can't read "${item.slice(0,50)}". Use: Exercise 3x10-12`);
    });
    if(ex.length)prog[name]={focus:focus[name]||"",ex};
  }
  const names=Object.keys(prog);
  if(!names.length)errs.push("No workouts found. Each line should look like: Glutes A: Hip thrust 4x8-12; Step-up 3x10-12");
  if(days){Object.entries(days).forEach(([d,x])=>{if(!prog[x]){errs.push(`DAYS lists "${x}", which isn't one of the workouts.`);delete days[d];}});}
  Object.entries(focus).forEach(([k,v])=>{if(prog[k])prog[k].focus=v;});
  return {program:prog,week:days&&Object.keys(days).length?days:defaultWeek(names),errs};
}
function programToText(P,W){
  P=P||PROGRAM;W=W||WEEK;const dn=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return "PROGRAM\n"+Object.entries(P).map(([k,v])=>`${k}: `+v.ex.map(([nm,pl,note])=>`${nm} ${pl.replace("×","x").replace("–","-")}${note?` (${note})`:""}`).join("; ")).join("\n")+
    "\nDAYS: "+Object.keys(W).sort((a,b)=>((+a+6)%7)-((+b+6)%7)).map(d=>`${dn[d]}=${W[d]}`).join(", ");
}
function applyProgram(P,W){
  PROGRAM=P;WEEK=W;ORDER=Object.keys(P);SESSIONS=[...ORDER,"Rest"];
  SC={"Rest":"#8f9ab0","Custom":"#5b8cff"};ORDER.forEach((x,i)=>SC[x]=PALETTE[i%PALETTE.length]);
  PLAN_OF={};Object.values(P).forEach(p=>p.ex.forEach(([n,pl,note,pick])=>{(pick||[n]).forEach(x=>{if(!PLAN_OF[x])PLAN_OF[x]={plan:pl,note};});}));
}

    else{toast("Copied! Now paste it in Claude.");C.q="";C.fallback="";C.open=false;render();}
    window.open(S.settings.coachUrl||"https://claude.ai/new","_blank","noopener");}
});

document.addEventListener("click",async ev=>{
  const b=ev.target.closest('[data-act="backup"]');if(!b)return;
  S.settings.lastBackup=todayKey();saveLocal();

  const name="michelle-fitness-backup-"+todayKey()+".json",file=new File([data],name,{type:"application/json"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});render();return;}}catch(e){if(e&&e.name==="AbortError"){return;}}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);render();toast("Backup saved");

document.addEventListener("change",async ev=>{
  const el=ev.target;if(el.id!=="restorefile")return;const f=el.files&&el.files[0];if(!f)return;

  el.value="";
});

/* ---------- local photo storage: blobs in IndexedDB, index in localStorage ---------- */
S.blobUrls={};
const IDB=()=>new Promise((res,rej)=>{try{const r=indexedDB.open("michelle-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("blobs");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});
const idbDo=(mode,fn)=>IDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction("blobs",mode),st=tx.objectStore("blobs"),q=fn(st);tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);}));
function photoIndex(){try{return JSON.parse(localStorage.getItem("michellephotos")||"{}");}catch(e){return {};}}
function savePhotoIndex(m){try{localStorage.setItem("michellephotos",JSON.stringify(m));}catch(e){}}
const localAssets={
  upload:async(blob)=>{const id=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,"0")).join("");
    await idbDo("readwrite",st=>st.put(blob,id));const url=URL.createObjectURL(blob);S.blobUrls[id]=url;return {id,url,sizeBytes:blob.size,contentType:blob.type};},
  delete:async(id)=>{await idbDo("readwrite",st=>st.delete(id));if(S.blobUrls[id]){URL.revokeObjectURL(S.blobUrls[id]);delete S.blobUrls[id];}return {deleted:true};}
};
const localPhotoDb={doc:(path)=>{const id=path.split("/")[1];return {
  set:async(d)=>{const m=photoIndex();m[id]=d;savePhotoIndex(m);},
  delete:async()=>{const m=photoIndex();delete m[id];savePhotoIndex(m);}};}};
async function initLocalPhotos(){
  if(!window.indexedDB)return;
  try{await IDB();}catch(e){return;}
  S.assets=localAssets;S.db=localPhotoDb;
  const m=photoIndex();S.photos=Object.entries(m).map(([id,d])=>({id,...d}));render();
  for(const p of S.photos){try{const blob=await idbDo("readonly",st=>st.get(p.asset));if(blob)S.blobUrls[p.asset]=URL.createObjectURL(blob);}catch(e){}}
  render();
}

      <li><b>Leg press, split squats and step-ups:</b> front and back of the thighs, plus your calves for balance.</li>

document.addEventListener("click",ev=>{

  if(a==="wback"){S.wstep=Math.max(1,S.wstep-1);render();window.scrollTo(0,0);return;}
  if(a==="wnext"){S.wstep=Math.min(6,S.wstep+1);render();window.scrollTo(0,0);return;}
  if(a==="wdone"){S.settings.setupDone=true;S.settings.introDone=true;saveLocal();S.tab="next";render();window.scrollTo(0,0);return;}

  const lb=g("su-lb"),ft=g("su-ft"),inch=g("su-in");
  if(lb<80||lb>400){toast("Enter your weight first.");return;}
  const protein=Math.round(lb*0.8/5)*5;   // about 0.8 g per lb of body weight

});

(async()=>{

})();
